<style>
:root{--bg:#101319;--fg:#e7ebf2;--dim:#929aaa;--line:#2a303c;--card:#171b23;--acc:#4ea8ff;--warn:#ffb020;--bad:#ff5f56;--ok:#3ddc97;--purple:#c6a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 Consolas,Menlo,monospace}header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#131720}h1{font-size:16px;margin:0;font-weight:700}#drop{border:1px dashed #465064;padding:6px 12px;border-radius:6px;color:var(--dim);cursor:pointer}#drop.on{border-color:var(--acc);color:var(--acc)}#meta{color:var(--dim);font-size:12px}.rulebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}.badge{display:inline-block;padding:2px 7px;border-radius:10px;background:#33264a;color:#d9c5ff}main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;padding:12px}.card{background:var(--card);border:1px solid #282e39;border-radius:8px;padding:10px;margin-bottom:12px}.card:last-child{margin-bottom:0}.card>b{font-size:12px;letter-spacing:.5px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);margin-bottom:8px}.legend span{white-space:nowrap}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}canvas{width:100%;display:block;background:#0d0f14;border-radius:6px;cursor:crosshair}#slider{width:100%;margin:0 0 8px}table{width:100%;border-collapse:collapse;font-size:12px}td{padding:3px 4px;border-bottom:1px solid #232936}td:first-child{color:var(--dim);white-space:nowrap}td:last-child{text-align:right;font-variant-numeric:tabular-nums}small{color:var(--dim)}#events{max-height:310px;overflow:auto;font-size:12px;margin-top:6px}#events div{padding:4px 5px;border-bottom:1px solid #232936;cursor:pointer}#events div:hover{background:#202630}.tag{font-size:10px;padding:0 5px;border-radius:3px;background:#2a303c;color:var(--dim);margin-right:4px}.t-phase{background:#33264a;color:var(--purple)}.t-qr{background:#123a2a;color:var(--ok)}.t-stop,.t-rule{background:#4a2020;color:#ff9a95}.t-lost,.t-slip{background:#4a3a10;color:var(--warn)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.kpi{padding:7px 8px;background:#12161d;border-radius:6px;border:1px solid #252c38}.kpi b{display:block;font-size:17px}.kpi small{display:block;margin-top:2px}.check{display:flex;gap:7px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #232936}.check:last-child{border-bottom:0}.check .dot{width:8px;height:8px;border-radius:50%;background:#586273;margin-top:5px;flex:none}.check.ok .dot{background:var(--ok)}.check.warn .dot{background:var(--warn)}.check.bad .dot{background:var(--bad)}.check b{font-size:12px}.check small{display:block}.note{color:var(--dim);font-size:11px;margin-top:6px}details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:#b9c2d2}.config{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.config label{display:flex;justify-content:space-between;gap:6px;align-items:center;color:var(--dim);font-size:11px}.config input{width:70px;background:#0e1218;color:var(--fg);border:1px solid #3a4351;border-radius:4px;padding:3px 4px;font:12px Consolas}.config button{grid-column:1/-1;background:#23476d;border:1px solid #3d79b5;color:#dceeff;border-radius:4px;padding:5px;cursor:pointer}@media(max-width:900px){main{grid-template-columns:1fr}}

<body>
<header><h1>智能搬运 · 四轮麦克纳姆日志分析器</h1><label id="drop">把 VOFA 的 .csv 拖进来 / 点击选择<input id="file" type="file" accept=".csv" hidden></label><span id="meta"><small>未加载日志</small></span></header>
<div class="rulebar"><span class="badge">智能搬运</span><span>两批 × 三件</span><span>二维码取任务</span><span>原料区 → 粗加工区 → 暂存区</span><span>第二批码垛</span><span>全车投影不得越出车道</span><span>连续 15 s 不移动结束</span></div>
<main><div><div class="card"><div class="legend"><span><i class="sw" style="background:#4ea8ff"></i>第一批 原料→粗加工</span><span><i class="sw" style="background:#3ddc97"></i>第一批 粗加工→暂存</span><span><i class="sw" style="background:#ffb020"></i>第二批</span><span><i class="sw" style="background:#c6a8ff"></i>返回/完成</span><span><i class="sw" style="background:#fff"></i>当前时刻</span><span>点轨迹或拖动时间条定位</span></div><canvas id="path" height="440"></canvas></div><div class="card"><input id="slider" type="range" min="0" max="0" value="0"><canvas id="strip" height="270"></canvas></div></div>
<div><div class="card"><b>智能搬运规则核对</b><div id="task"></div></div><div class="card"><b>当前麦克纳姆底盘状态</b><table id="state"></table></div><div class="card"><b>数据通道与底盘参数</b><div class="note">原网页的 43 通道位置保留；麦克纳姆横移、角速度和四轮数据可在下方映射。空白表示日志没有该项。</div><details><summary>展开编辑通道映射</summary><div class="config"><label>纵向目标 vx <input id="ch-vx-t" type="number" min="0" value="19"></label><label>纵向实测 vx <input id="ch-vx-a" type="number" min="0" value="20"></label><label>横向目标 vy <input id="ch-vy-t" type="number" min="0" placeholder="空"></label><label>横向实测 vy <input id="ch-vy-a" type="number" min="0" placeholder="空"></label><label>角速度目标 wz <input id="ch-wz-t" type="number" min="0" placeholder="空"></label><label>角速度实测 wz <input id="ch-wz-a" type="number" min="0" placeholder="空"></label><label>左前轮 FL <input id="ch-fl" type="number" min="0" placeholder="空"></label><label>右前轮 FR <input id="ch-fr" type="number" min="0" placeholder="空"></label><label>左后轮 RL <input id="ch-rl" type="number" min="0" placeholder="空"></label><label>右后轮 RR <input id="ch-rr" type="number" min="0" placeholder="空"></label><label>位置 X <input id="ch-x" type="number" min="0" value="32"></label><label>位置 Y <input id="ch-y" type="number" min="0" value="33"></label><label>帧周期(s) <input id="dt" type="number" min="0.001" step="0.001" value="0.02"></label><label>脉冲→m/s <input id="pv" type="number" min="0" step="0.000001" value="0.073632"></label><label>轮半径(m) <input id="wr" type="number" min="0.001" step="0.001" value="0.05"></label><label>轴距 L(m) <input id="wb" type="number" min="0.01" step="0.01" value="0.32"></label><label>轮距 W(m) <input id="wt" type="number" min="0.01" step="0.01" value="0.30"></label><label>停滞阈值(m/s) <input id="eps" type="number" min="0" step="0.01" value="0.04"></label><button id="apply">应用映射并重绘</button></div></details></div><div class="card"><b>事件（点击跳转）</b><div id="events"></div></div></div></main>
<script>
'use strict';
var DT=.02,PV=.073632,PARAM={wheelRadius:.05,wheelBase:.32,track:.30,stopEps:.04};
var C={mode:0,phase:1,flags:2,vseq:3,vage:4,cam_ms:5,vrej:6,ovr:7,exec:8,valid:9,rej:10,bear:11,dist:12,wpx:13,st_tgt:14,st_act:15,yaw:16,yawu:17,yrate:18,vx_t:19,vx_a:20,vy_t:null,vy_a:null,wz_t:null,wz_a:null,ox:32,oy:33,odo:34,dL:35,dR:36,drop:37,mark:38,elat:39,k:40,st_cmd:41,herr:42,fl:null,fr:null,rl:null,rr:null};
var PH={0:'等待/读码与自主移动',1:'第一批：原料→粗加工',2:'第一批：粗加工→暂存',3:'第二批：原料→粗加工',4:'完成/返回启停区',5:'第二批：粗加工→暂存',6:'完成'},rows=[],segs=[],evts=[],cur=0,bb=null;
function idx(v){var n=parseInt(v,10);return isFinite(n)&&n>=0?n:null}function val(r,k){var n=C[k];return n!==null&&n!==undefined&&n<r.length?r[n]:NaN}function f(v,n){return v===null||v===undefined||!isFinite(v)?'--':v.toFixed(n===undefined?2:n)}
function parse(txt){var out=[],ls=txt.split(/\r?\n/);for(var i=0;i<ls.length;i++){var s=ls[i].trim();if(!s||/^I\d/.test(s))continue;var a=s.split(','),r=new Float64Array(a.length),ok=1;for(var j=0;j<a.length;j++){var v=parseFloat(a[j]);if(!isFinite(v)){ok=0;break}r[j]=v}if(ok&&a.length>=21)out.push(r)}return out}
function labelFor(r){return PH[r[C.phase]]||('自主移动（阶段码 '+r[C.phase]+'）')}function segment(R){var out=[],st=-1,lab='';for(var i=0;i<R.length;i++){var L=labelFor(R[i]);if(L!==lab){if(st>=0&&i-st>10)out.push({lab:lab,a:st,b:i-1});lab=L;st=i}}if(st>=0&&R.length-st>10)out.push({lab:lab,a:st,b:R.length-1});return out}
function actual(r){var vx=val(r,'vx_a'),vy=val(r,'vy_a'),wz=val(r,'wz_a'),wheel=['fl','fr','rl','rr'].map(function(k){return val(r,k)});if(!isFinite(vy)&&wheel.every(isFinite)){var rr=PARAM.wheelRadius,L=PARAM.wheelBase,W=PARAM.track;vx=(wheel[0]+wheel[1]+wheel[2]+wheel[3])*PV/4;vy=(-wheel[0]+wheel[1]+wheel[2]-wheel[3])*PV/4;wz=(-wheel[0]+wheel[1]-wheel[2]+wheel[3])*PV/(4*(L+W))*180/Math.PI}else{if(isFinite(vx))vx*=PV;if(isFinite(vy))vy*=PV}return{vx:vx,vy:vy,wz:wz,wheel:wheel}}
function target(r){var vx=val(r,'vx_t'),vy=val(r,'vy_t'),wz=val(r,'wz_t');if(isFinite(vx))vx*=PV;if(isFinite(vy))vy*=PV;return{vx:vx,vy:vy,wz:wz}}function speed(r){var a=actual(r);return Math.sqrt((isFinite(a.vx)?a.vx:0)**2+(isFinite(a.vy)?a.vy:0)**2)}
function events(R){var e=[],i,z=-1;for(i=0;i<segs.length;i++)e.push({i:segs[i].a,t:'phase',s:'进入 '+segs[i].lab});for(i=1;i<R.length;i++)if(val(R[i],'valid')>.5&&val(R[i-1],'valid')<=.5)e.push({i:i,t:'qr',s:'视觉重新有效，可检查二维码读取/任务显示'});var qrSeen=false;for(i=0;i<R.length;i++){if(!qrSeen&&val(R[i],'valid')>.5&&isFinite(val(R[i],'vseq'))){e.push({i:i,t:'qr',s:'检测到有效视觉帧序，可回看二维码读取/任务显示'});qrSeen=true}}for(i=0;i<R.length;i++){var stop=speed(R[i])<PARAM.stopEps&&Math.abs(val(R[i],'vx_t')||0)*PV>.08;if(stop&&z<0)z=i;if(!stop&&z>=0){if(i-z>=Math.ceil(15/DT))e.push({i:z,t:'stop',s:'规则风险：连续 '+((i-z)*DT).toFixed(1)+'s 几乎未移动，超过 15s 将结束本轮'});z=-1}}z=-1;for(i=0;i<R.length;i++){var a=actual(R[i]),t=target(R[i]),sl=isFinite(t.vx)&&Math.abs(t.vx)>.20&&isFinite(a.vx)&&Math.abs(a.vx)<.05;if(sl&&z<0)z=i;if(!sl&&z>=0){if(i-z>=Math.ceil(.5/DT))e.push({i:z,t:'slip',s:'疑似打滑/卡住：目标纵向速度存在而实测接近 0'});z=-1}}z=-1;for(i=0;i<R.length;i++){var bad=val(R[i],'valid')<.5&&speed(R[i])>.08;if(bad&&z<0)z=i;if(!bad&&z>=0){if(i-z>=Math.ceil(.2/DT))e.push({i:z,t:'lost',s:'视觉无效 '+((i-z)*DT).toFixed(1)+'s，二维码/物料识别可能中断'});z=-1}}for(i=1;i<R.length;i++){var o=val(R[i],'ovr'),op=val(R[i-1],'ovr');if(isFinite(o)&&isFinite(op)&&o>op)e.push({i:i,t:'rule',s:'调度超时 +'+(o-op)+'，单拍 '+f(val(R[i],'exec'),0)+'us'})}e.sort(function(a,b){return a.i-b.i});return e}
function bounds(){var lo=[1e9,1e9],hi=[-1e9,-1e9];for(var i=0;i<rows.length;i++){var x=val(rows[i],'ox'),y=val(rows[i],'oy');if(!isFinite(x)||!isFinite(y))continue;if(x<lo[0])lo[0]=x;if(y<lo[1])lo[1]=y;if(x>hi[0])hi[0]=x;if(y>hi[1])hi[1]=y}if(lo[0]===1e9)return{x0:-1,y0:-1,x1:1,y1:1};var m=Math.max(1,(hi[0]-lo[0])*.06,(hi[1]-lo[1])*.06);return{x0:lo[0]-m,y0:lo[1]-m,x1:hi[0]+m,y1:hi[1]+m}}
function phaseColor(l){if(l.indexOf('第一批：原料')>=0)return'#4ea8ff';if(l.indexOf('第一批：粗加工')>=0)return'#3ddc97';if(l.indexOf('第二批')>=0)return'#ffb020';return'#c6a8ff'}
function drawPath(){var cv=document.getElementById('path'),g=cv.getContext('2d');cv.width=Math.max(400,cv.clientWidth*2);cv.height=880;cv.style.height='440px';g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);if(!rows.length)return;var sx=cv.width/(bb.x1-bb.x0),sy=cv.height/(bb.y1-bb.y0),s=Math.min(sx,sy),ox=(cv.width-(bb.x1-bb.x0)*s)/2,oy=(cv.height-(bb.y1-bb.y0)*s)/2;P=function(x,y){return[ox+(x-bb.x0)*s,cv.height-oy-(y-bb.y0)*s]};g.strokeStyle='#1d222c';g.lineWidth=1;for(var gx=Math.ceil(bb.x0);gx<bb.x1;gx++){var p=P(gx,bb.y0),q=P(gx,bb.y1);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}for(var gy=Math.ceil(bb.y0);gy<bb.y1;gy++){var p2=P(bb.x0,gy),q2=P(bb.x1,gy);g.beginPath();g.moveTo(p2[0],p2[1]);g.lineTo(q2[0],q2[1]);g.stroke()}for(var si=0;si<segs.length;si++){var sg=segs[si];g.strokeStyle=phaseColor(sg.lab);g.lineWidth=3;g.beginPath();for(var j=sg.a;j<=sg.b;j++){var x=val(rows[j],'ox'),y=val(rows[j],'oy');if(!isFinite(x)||!isFinite(y))continue;var pp=P(x,y);if(j===sg.a)g.moveTo(pp[0],pp[1]);else g.lineTo(pp[0],pp[1])}g.stroke()}var r=rows[cur],pc=P(val(r,'ox'),val(r,'oy')),a=actual(r),th=(val(r,'yaw')||0)*Math.PI/180;g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(pc[0],pc[1]);g.lineTo(pc[0]+Math.cos(th)*42,pc[1]-Math.sin(th)*42);g.stroke();if(isFinite(a.vx)||isFinite(a.vy)){var ang=Math.atan2(a.vy||0,a.vx||0)+th,mag=Math.min(45,Math.sqrt((a.vx||0)**2+(a.vy||0)**2)*35);g.strokeStyle='#3ddc97';g.beginPath();g.moveTo(pc[0],pc[1]);g.lineTo(pc[0]+Math.cos(ang)*mag,pc[1]-Math.sin(ang)*mag);g.stroke()}g.fillStyle='#fff';g.beginPath();g.arc(pc[0],pc[1],8,0,6.3);g.fill();g.fillStyle='#3ddc97';g.font='16px Consolas';g.textAlign='left';g.fillText('当前 '+labelFor(r),pc[0]+12,pc[1]+6);if(segs.length){var st=segs[0].a,en=segs[segs.length-1].b,ps=P(val(rows[st],'ox'),val(rows[st],'oy')),pe=P(val(rows[en],'ox'),val(rows[en],'oy'));g.fillStyle='#3ddc97';g.beginPath();g.arc(ps[0],ps[1],8,0,6.3);g.fill();g.fillStyle='#ff5f56';g.fillRect(pe[0]-7,pe[1]-7,14,14)}}
function pick(mx,my){var best=0,bd=1e18;for(var i=0;i<rows.length;i++){var p=P(val(rows[i],'ox'),val(rows[i],'oy')),d=(p[0]-mx)**2+(p[1]-my)**2;if(d<bd){bd=d;best=i}}go(best)}
var TR=[{n:'纵向 vx (m/s)',lo:-2,hi:2,lines:[{c:'#3ddc97',f:function(r){return target(r).vx}},{c:'#4ea8ff',f:function(r){return actual(r).vx}}]},{n:'横向 vy (m/s)',lo:-2,hi:2,lines:[{c:'#3ddc97',f:function(r){return target(r).vy}},{c:'#4ea8ff',f:function(r){return actual(r).vy}}]},{n:'角速度 wz (°/s)',lo:-180,hi:180,lines:[{c:'#ffb020',f:function(r){return target(r).wz}},{c:'#ff5f56',f:function(r){return actual(r).wz}}]},{n:'合速度 (m/s)',lo:0,hi:2,lines:[{c:'#c6a8ff',f:function(r){return speed(r)}}]}];
function drawStrip(){var cv=document.getElementById('strip'),g=cv.getContext('2d');cv.width=Math.max(400,cv.clientWidth*2);cv.height=540;cv.style.height='270px';g.clearRect(0,0,cv.width,cv.height);if(!rows.length)return;var H=cv.height/TR.length,W=cv.width;for(var k=0;k<TR.length;k++){var tr=TR[k],y0=k*H;g.strokeStyle='#242833';g.lineWidth=1;g.beginPath();g.moveTo(0,y0+H/2);g.lineTo(W,y0+H/2);g.stroke();for(var q=0;q<tr.lines.length;q++){var ln=tr.lines[q];g.strokeStyle=ln.c;g.lineWidth=1.6;g.beginPath();for(var i=0;i<rows.length;i++){var v=ln.f(rows[i]);if(!isFinite(v))continue;var yy=y0+H-4-((v-tr.lo)/(tr.hi-tr.lo))*(H-8),xx=i/(rows.length-1)*W;if(i===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}g.stroke()}g.fillStyle='#dce3ed';g.font='17px Consolas';g.textAlign='left';g.fillText(tr.n+'  ['+tr.lo+' , '+tr.hi+']',6,y0+18)}var cx=cur/(rows.length-1)*W;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(cx,0);g.lineTo(cx,cv.height);g.stroke()}
function movementName(a){var vx=Math.abs(a.vx||0),vy=Math.abs(a.vy||0),w=Math.abs(a.wz||0);if(vx<.04&&vy<.04&&w<3)return'停止';if(w>20&&vx<.12&&vy<.12)return'原地旋转';if(vy>vx*1.3)return'横移';if(vx>vy*1.3)return'前后行驶';return'斜向行驶'}
function drawState(){if(!rows.length)return;var r=rows[cur],T=document.getElementById('state'),a=actual(r),t=target(r),h='';function row(k,v,n){h+='<tr><td>'+k+'</td><td>'+v+(n?' <small>'+n+'</small>':'')+'</td></tr>'}row('时间',f(cur*DT,2)+' s','帧 '+cur+'/'+(rows.length-1));row('任务阶段',labelFor(r),'原始阶段码 '+r[C.phase]);row('里程',f(val(r,'odo'),1)+' m','x '+f(val(r,'ox'),1)+' y '+f(val(r,'oy'),1));row('底盘动作',movementName(a));row('vx 纵向',f(t.vx)+' / '+f(a.vx)+' m/s','目标 / 实测');row('vy 横向',f(t.vy)+' / '+f(a.vy)+' m/s','目标 / 实测');row('wz 角速度',f(t.wz,1)+' / '+f(a.wz,1)+' °/s','目标 / 实测');row('合速度',f(speed(r))+' m/s');if(a.wheel.every(isFinite))row('四轮原始值',a.wheel.map(function(x){return f(x,0)}).join(' / '),'FL / FR / RL / RR');row('偏航角',f(val(r,'yaw'),1)+'°','角速度 '+f(val(r,'yrate'),1)+'°/s');row('视觉',val(r,'valid')>.5?'有效':'无效','帧龄 '+f(val(r,'vage')*10,0)+' ms');row('方位/距离',f(val(r,'bear'),1)+'° / '+f(val(r,'dist'))+' m');row('复现索引 k',f(val(r,'k'),0));row('调度超时',f(val(r,'ovr'),0)+' 次','单拍 '+f(val(r,'exec'),0)+'us');row('日志丢帧',f(val(r,'drop'),0),'flags '+val(r,'flags'));T.innerHTML=h}
function checklist(){if(!rows.length){document.getElementById('task').innerHTML='<small>加载日志后自动核对。官方得分仍以裁判现场判定为准。</small>';return}var active=segs.filter(function(s){return s.lab.indexOf('等待')<0}),vision=rows.filter(function(r){return val(r,'valid')>.5}).length/rows.length,hasQR=rows.some(function(r){return val(r,'valid')>.5&&isFinite(val(r,'vseq'))}),maxSide=0;rows.forEach(function(r){var a=actual(r);if(isFinite(a.vy))maxSide=Math.max(maxSide,Math.abs(a.vy))});var stopped=evts.some(function(e){return e.t==='stop'}),slip=evts.some(function(e){return e.t==='slip'});function c(cls,title,note){return'<div class="check '+cls+'"><i class="dot"></i><div><b>'+title+'</b><small>'+note+'</small></div></div>'}var html=c(hasQR?'ok':'warn','二维码/视觉链路',hasQR?'检测到有效视觉帧序，可回看二维码读取与任务码显示。':'日志未提供有效视觉帧序，无法证明二维码读取成功。');html+=c(active.length>=4?'ok':'warn','搬运流程段',active.length>=4?'识别到 '+active.length+' 个任务阶段；规则要求两批物料各完成原料→粗加工→暂存。':'当前日志只识别到 '+active.length+' 个阶段，可能未覆盖完整流程。');html+=c(vision>.8?'ok':'warn','识别连续性','视觉有效率 '+f(vision*100,0)+'%，丢失事件 '+evts.filter(function(e){return e.t==='lost'}).length+' 次。');html+=c(!stopped?'ok':'bad','15 秒无移动规则',stopped?'发现超过 15 秒停滞风险，按规则本轮可能结束。':'未发现超过 15 秒的连续停滞。');html+=c(!slip?'ok':'warn','打滑/卡住风险',slip?'发现目标速度存在而实测速度接近 0 的片段。':'未发现明显的纵向打滑特征。');html+=c('warn','车道边界','日志没有车道边界通道，不能仅凭轨迹判定“全车投影不越道”；请结合场地图复核。');html+='<div class="kpis"><div class="kpi"><b>'+active.length+'</b><small>识别阶段</small></div><div class="kpi"><b>'+f(vision*100,0)+'%</b><small>视觉有效率</small></div><div class="kpi"><b>'+f(maxSide)+' m/s</b><small>最大横移</small></div></div><div class="note">规则提醒：第二批物料须放在第一批同色物料上方；静态任务码需始终显示且字高不小于 12 mm。日志查看器只能做过程核对，不能替代现场计分。</div>';document.getElementById('task').innerHTML=html}
function drawEvents(){var E=document.getElementById('events'),h='';for(var i=0;i<evts.length;i++)h+='<div data-i="'+evts[i].i+'"><span class="tag t-'+evts[i].t+'">'+(evts[i].i*DT).toFixed(1)+'s</span>'+evts[i].s+'</div>';E.innerHTML=h||'<small>未识别到异常或阶段事件</small>';var ds=E.querySelectorAll('div[data-i]');for(i=0;i<ds.length;i++)ds[i].onclick=function(){go(+this.getAttribute('data-i'))}}
function go(i){if(!rows.length)return;cur=Math.max(0,Math.min(rows.length-1,i|0));document.getElementById('slider').value=cur;drawPath();drawStrip();drawState()}
function load(txt,name){rows=parse(txt);if(rows.length<20){alert('没有读出有效数据。请确认是至少 21 通道的 VOFA CSV。');return}segs=segment(rows);bb=bounds();evts=events(rows);cur=0;var sl=document.getElementById('slider');sl.max=rows.length-1;sl.value=0;var d=segs.map(function(s){return s.lab+' '+((s.b-s.a)*DT).toFixed(1)+'s/'+Math.abs((val(rows[s.b],'odo')||0)-(val(rows[s.a],'odo')||0)).toFixed(1)+'m'}).join('　');document.getElementById('meta').innerHTML='<small>'+name+'　'+rows.length+' 帧 / '+(rows.length*DT).toFixed(1)+' s　'+d+'</small>';drawEvents();checklist();go(0)}
function feed(files){if(!files||!files[0])return;var file=files[0],rd=new FileReader();rd.onload=function(){load(String(rd.result),file.name)};rd.readAsText(file)}
function readConfig(){DT=parseFloat(document.getElementById('dt').value)||.02;PV=parseFloat(document.getElementById('pv').value)||.073632;PARAM.wheelRadius=parseFloat(document.getElementById('wr').value)||.05;PARAM.wheelBase=parseFloat(document.getElementById('wb').value)||.32;PARAM.track=parseFloat(document.getElementById('wt').value)||.30;PARAM.stopEps=parseFloat(document.getElementById('eps').value)||.04;C.vx_t=idx(document.getElementById('ch-vx-t').value);C.vx_a=idx(document.getElementById('ch-vx-a').value);C.vy_t=idx(document.getElementById('ch-vy-t').value);C.vy_a=idx(document.getElementById('ch-vy-a').value);C.wz_t=idx(document.getElementById('ch-wz-t').value);C.wz_a=idx(document.getElementById('ch-wz-a').value);C.fl=idx(document.getElementById('ch-fl').value);C.fr=idx(document.getElementById('ch-fr').value);C.rl=idx(document.getElementById('ch-rl').value);C.rr=idx(document.getElementById('ch-rr').value);C.ox=idx(document.getElementById('ch-x').value)||32;C.oy=idx(document.getElementById('ch-y').value)||33}
document.getElementById('file').onchange=function(){feed(this.files)};var drop=document.getElementById('drop');document.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('on')});document.addEventListener('dragleave',function(){drop.classList.remove('on')});document.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('on');feed(e.dataTransfer.files)});document.getElementById('slider').oninput=function(){go(+this.value)};document.getElementById('path').onclick=function(e){if(!rows.length)return;var b=this.getBoundingClientRect();pick((e.clientX-b.left)*this.width/b.width,(e.clientY-b.top)*this.height/b.height)};document.getElementById('strip').onclick=function(e){if(!rows.length)return;var b=this.getBoundingClientRect();go(Math.round((e.clientX-b.left)/b.width*(rows.length-1)))};document.getElementById('apply').onclick=function(){readConfig();if(rows.length){segs=segment(rows);bb=bounds();evts=events(rows);drawEvents();checklist();go(cur)}};document.addEventListener('keydown',function(e){if(!rows.length)return;var s=e.shiftKey?25:1;if(e.key==='ArrowLeft'){go(cur-s);e.preventDefault()}else if(e.key==='ArrowRight'){go(cur+s);e.preventDefault()}});window.addEventListener('resize',function(){if(rows.length){drawPath();drawStrip()}});readConfig();checklist();
</script>
